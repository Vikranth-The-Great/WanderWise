<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="mountains" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="1920" height="1080" fill="url(#sunset)" />
  
  <!-- Abstract travel elements -->
  <circle cx="1600" cy="300" r="80" fill="#F97316" opacity="0.8" />
  
  <!-- Mountains in the background -->
  <path d="M0,600 L300,400 L600,550 L900,350 L1200,500 L1500,300 L1800,450 L1920,400 L1920,1080 L0,1080 Z" fill="url(#mountains)" opacity="0.8" />
  
  <!-- Abstract path/road -->
  <path d="M860,1080 L960,400 L1060,1080 Z" fill="#F8FAFC" opacity="0.2" />
  <path d="M960,1080 L960,400" stroke="#F97316" stroke-width="5" stroke-dasharray="20,20" />
  
  <!-- Abstract travel icons -->
  <circle cx="800" cy="500" r="20" fill="#F97316" />
  <circle cx="1100" cy="600" r="15" fill="#F97316" />
  <circle cx="900" cy="700" r="25" fill="#F97316" />
  
  <!-- Overlay to make text more readable -->
  <rect width="1920" height="1080" fill="#1E3A8A" opacity="0.3" />
</svg>